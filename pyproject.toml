[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "majesty-gold-hd-mod-manager"
version = "0.3.1"
description = "Merge Majesty Gold HD CAM mods, on a container layer that unpacks, inspects, and repacks CAM archives."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Majesty Gold HD CAM Merger contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = []
gui = [
  "PySide6-Essentials>=6.7,<6.9"
]
package = [
  "pyinstaller>=6.10,<7"
]

[project.scripts]
majesty-cam = "majesty_cam.cli:main"

[project.gui-scripts]
majesty-mod-manager = "majesty_cam.manager.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/majesty_cam"]
